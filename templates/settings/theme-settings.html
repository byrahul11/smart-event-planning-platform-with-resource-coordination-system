{% extends "base/base.html" %}
{% block title %}Theme Settings{% endblock %}

{% block content %}
<div class="page-title-row">
  <h1>Theme Settings</h1>
  <div class="breadcrumb"><a href="{% url 'profile' %}">Profile</a> / Theme Settings</div>
</div>

<div class="card" style="max-width:480px;">
  <div style="padding:26px;">

    <form method="post" action="{% url 'theme_settings' %}">
      {% csrf_token %}
      {% if theme_dark_mode %}<input type="hidden" name="dark_mode" value="on">{% endif %}

      <div class="form-group">
        <label class="section-label">Font Family</label>
        {{ form.font_family }}
      </div>

      <div class="form-group">
        <label class="section-label">Primary Color</label>
        <div class="swatch-row">
          <span class="swatch {% if theme_primary_color == '#3949ab' %}selected{% endif %}" style="background:#3949ab;" onclick="pickColor('primary_color', '#3949ab', this)"></span>
          <span class="swatch {% if theme_primary_color == '#28a745' %}selected{% endif %}" style="background:#28a745;" onclick="pickColor('primary_color', '#28a745', this)"></span>
          <span class="swatch {% if theme_primary_color == '#e63946' %}selected{% endif %}" style="background:#e63946;" onclick="pickColor('primary_color', '#e63946', this)"></span>
          <span class="swatch {% if theme_primary_color == '#8e6fee' %}selected{% endif %}" style="background:#8e6fee;" onclick="pickColor('primary_color', '#8e6fee', this)"></span>
          <span class="swatch {% if theme_primary_color == '#f39c12' %}selected{% endif %}" style="background:#f39c12;" onclick="pickColor('primary_color', '#f39c12', this)"></span>
          <input type="hidden" name="primary_color" id="primary_color_input" value="{{ theme_primary_color }}">
        </div>
      </div>

      <div class="form-group">
        <label class="section-label">Sidebar Color</label>
        <div class="swatch-row">
          <span class="swatch {% if theme_sidebar_color == '#17203a' %}selected{% endif %}" style="background:#17203a;" onclick="pickColor('sidebar_color', '#17203a', this)"></span>
          <span class="swatch {% if theme_sidebar_color == '#1b2a4e' %}selected{% endif %}" style="background:#1b2a4e;" onclick="pickColor('sidebar_color', '#1b2a4e', this)"></span>
          <span class="swatch {% if theme_sidebar_color == '#2f3b52' %}selected{% endif %}" style="background:#2f3b52;" onclick="pickColor('sidebar_color', '#2f3b52', this)"></span>
          <span class="swatch {% if theme_sidebar_color == '#000000' %}selected{% endif %}" style="background:#000000;" onclick="pickColor('sidebar_color', '#000000', this)"></span>
          <input type="hidden" name="sidebar_color" id="sidebar_color_input" value="{{ theme_sidebar_color }}">
        </div>
      </div>

      <div class="form-group">
        <label class="section-label">Font Size (<span id="font-size-value">{{ theme_font_size }}</span>px)</label>
        <input type="range" name="font_size" min="12" max="22" value="{{ theme_font_size }}"
               oninput="document.getElementById('font-size-value').innerText = this.value;">
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3">Save Theme</button>
    </form>

    <form method="post" action="{% url 'reset_theme' %}" class="mt-3">
      {% csrf_token %}
      <button type="submit" class="btn w-100" style="background:#ff5c4d;color:#fff;">Reset Theme</button>
    </form>

  </div>
</div>
{% endblock %}
