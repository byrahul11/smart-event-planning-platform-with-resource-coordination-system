<aside class="control-sidebar" id="customizePanel">
  <div class="p-3">
    <h5>Customize Theme</h5>
    <hr class="bg-secondary">

    <div class="custom-control custom-checkbox mb-2">
      <input type="checkbox" class="custom-control-input" id="navbarBorder" checked>
      <label class="custom-control-label" for="navbarBorder">No Navbar border</label>
    </div>

    <div class="custom-control custom-checkbox mb-2">
      <input type="checkbox" class="custom-control-input" id="bodySmall">
      <label class="custom-control-label" for="bodySmall">Body small text</label>
    </div>

    <div class="custom-control custom-checkbox mb-2">
      <input type="checkbox" class="custom-control-input" id="navbarSmall">
      <label class="custom-control-label" for="navbarSmall">Navbar small text</label>
    </div>

    <div class="custom-control custom-checkbox mb-2">
      <input type="checkbox" class="custom-control-input" id="sidebarCompact">
      <label class="custom-control-label" for="sidebarCompact">Sidebar nav compact</label>
    </div>

    <div class="custom-control custom-checkbox mb-2">
      <input type="checkbox" class="custom-control-input" id="brandSmall">
      <label class="custom-control-label" for="brandSmall">Brand small text</label>
    </div>

    <hr class="bg-secondary">
    <h6>Navbar Color</h6>
    <div class="swatch-row">
      <span class="theme-swatch" data-panel="navbar" data-value="gradient"
            style="background:linear-gradient(135deg,#6a11cb,#2575fc);" title="Signature (default)"></span>
      <span class="theme-swatch" data-panel="navbar" data-value="#17a2b8" style="background:#17a2b8;" title="Teal"></span>
      <span class="theme-swatch" data-panel="navbar" data-value="#28a745" style="background:#28a745;" title="Green"></span>
      <span class="theme-swatch" data-panel="navbar" data-value="#dc3545" style="background:#dc3545;" title="Red"></span>
      <span class="theme-swatch" data-panel="navbar" data-value="#343a40" style="background:#343a40;" title="Dark"></span>
    </div>

    <h6>Accent Color</h6>
    <div class="swatch-row">
      <span class="theme-swatch" data-panel="accent" data-value="#9b6bff" style="background:#9b6bff;" title="Purple (default)"></span>
      <span class="theme-swatch" data-panel="accent" data-value="#2575fc" style="background:#2575fc;" title="Blue"></span>
      <span class="theme-swatch" data-panel="accent" data-value="#28a745" style="background:#28a745;" title="Green"></span>
      <span class="theme-swatch" data-panel="accent" data-value="#f39c12" style="background:#f39c12;" title="Orange"></span>
    </div>

    <h6>Sidebar Style</h6>
    <div class="swatch-row">
      <span class="theme-swatch dark-swatch" data-panel="sidebar" data-value="dark" title="Dark Sidebar (default)"></span>
      <span class="theme-swatch light-swatch" data-panel="sidebar" data-value="light" title="Light Sidebar"></span>
    </div>

    <h6>Brand Logo Color</h6>
    <div class="swatch-row">
      <span class="theme-swatch" data-panel="brand" data-value="#ffffff" style="background:#ffffff;" title="White (default)"></span>
      <span class="theme-swatch" data-panel="brand" data-value="#ffd700" style="background:#ffd700;" title="Gold"></span>
      <span class="theme-swatch" data-panel="brand" data-value="#9b6bff" style="background:#9b6bff;" title="Purple"></span>
    </div>
  </div>
</aside>

<div class="control-sidebar-overlay" id="customizeOverlay"></div>
