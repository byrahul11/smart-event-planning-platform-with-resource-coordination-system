{% extends "base/base.html" %}
{% block title %}Delete Category{% endblock %}

{% block content %}
<div class="confirm-card">
  <h1>Delete Category?</h1>
  <p style="margin:14px 0;color:#555;">
    Are you sure you want to delete "<strong>{{ category.name }}</strong>"? This can't be undone.
  </p>
  <form method="post" action="{% url 'delete_category' category.pk %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
  </form>
  <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
</div>
{% endblock %}
