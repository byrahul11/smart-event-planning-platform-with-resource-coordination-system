{% extends "base/base.html" %}
{% block title %}Create Category{% endblock %}

{% block content %}
<div class="form-card">
  <h1>Create Category</h1>
  <form method="post" action="{% url 'create_category' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="name">Category Name</label>
      <input type="text" id="name" name="name" placeholder="e.g. Technical" required>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Short description"></textarea>
    </div>
    <button type="submit" class="btn btn-success" style="width:100%;">Create Category</button>
  </form>
</div>
{% endblock %}
