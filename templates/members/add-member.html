{% extends "base/base.html" %}
{% block title %}Add Event Member{% endblock %}

{% block content %}
<div class="form-card">
  <h1>Add Event Member</h1>
  <form method="post" action="{% url 'add_event_member' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_event">Event</label>
      {{ form.event }}
    </div>
    <div class="form-group">
      <label for="id_name">Member Name</label>
      {{ form.name }}
    </div>
    <div class="form-group">
      <label for="id_email">Email</label>
      {{ form.email }}
    </div>
    <div class="form-group">
      <label for="id_phone">Phone</label>
      {{ form.phone }}
    </div>
    <div class="form-group">
      <label for="id_role">Role</label>
      {{ form.role }}
    </div>
    <button type="submit" class="btn btn-success w-100">Add Member</button>
  </form>
</div>
{% endblock %}
