{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Event Registration Platform</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body { display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #6a11cb, #2575fc); min-height: 100vh; }
  </style>
</head>
<body>

  <div class="form-card">
    <h1>Login</h1>

    {% include "base/messages.html" %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>

      <p style="text-align:center;margin-top:12px;font-size:14px;">
        Don't have an account? <a href="{% url 'signup' %}" style="color:#6a11cb;font-weight:600;">Sign Up</a>
      </p>
      <p style="text-align:center;margin-top:6px;font-size:12px;color:#999;">
        Admin/organizer? Log in with your superuser account.
      </p>
    </form>
  </div>

</body>
</html>
